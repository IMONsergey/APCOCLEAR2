name: Compare page performance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline:
        description: Commit to compare with
        required: false
        default: HEAD^

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APCO_TEST_BASE_PATH: /performance/
      BASELINE_REF: ${{ github.event.pull_request.base.sha || inputs.baseline || 'HEAD^' }}
    steps:
      - name: Check out candidate and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - name: Install measurement tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Build baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_REF^{commit}"
          git worktree add --detach .work/performance-baseline "$BASELINE_REF"
          npm ci --prefix .work/performance-baseline
          npm --prefix .work/performance-baseline run build -- --base="$APCO_TEST_BASE_PATH"
          npm run build -- --base="$APCO_TEST_BASE_PATH"
      - name: Measure baseline
        run: >-
          npm run measure:performance --
          --dist .work/performance-baseline/dist
          --runs 3
          --routes /,/ru/,/zh-hant/,/about/,/docs/investors/,/legal/privacy-policy/,/developers/api/docs/
          --screenshots .work/performance-screenshots/before
          --output .work/performance-before.json
      - name: Measure candidate
        run: >-
          npm run measure:performance --
          --runs 3
          --routes /,/ru/,/zh-hant/,/about/,/docs/investors/,/legal/privacy-policy/,/developers/api/docs/
          --screenshots .work/performance-screenshots/after
          --output .work/performance-after.json
      - name: Summarize controlled comparison
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const before = JSON.parse(readFileSync('.work/performance-before.json', 'utf8'));
          const after = JSON.parse(readFileSync('.work/performance-after.json', 'utf8'));
          const lines = [
            '## Page performance',
            '',
            'Medians of three cold Chromium runs on the same runner. Mobile: 4× CPU throttling, 80 ms latency, 1.6 Mbps. These are lab samples, not field Core Web Vitals.',
            '',
            '| Profile / route | LCP before → after, ms | Blocking before → after, ms | Transfer before → after, KiB | CLS after |',
            '| --- | ---: | ---: | ---: | ---: |',
          ];
          for (const row of after.summary) {
            const old = before.summary.find((item) => item.route === row.route && item.profile === row.profile);
            if (!old) throw new Error(`Missing baseline for ${row.profile} ${row.route}`);
            lines.push(`| ${row.profile} ${row.route} | ${old.lcpMs} → ${row.lcpMs} | ${old.blockingMs} → ${row.blockingMs} | ${Math.round(old.resourceBytes / 1024)} → ${Math.round(row.resourceBytes / 1024)} | ${row.cls} |`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          JS
      - name: Preserve measurements and first screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: page-performance-${{ github.sha }}
          retention-days: 14
          path: |
            .work/performance-before.json
            .work/performance-after.json
            .work/performance-screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
