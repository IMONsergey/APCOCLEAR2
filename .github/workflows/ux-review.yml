name: Cross-browser UX review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_APCO_PRODUCT_URL: ${{ vars.VITE_APCO_PRODUCT_URL }}
  VITE_APCO_SUPPORT_EMAIL: ${{ vars.VITE_APCO_SUPPORT_EMAIL }}
  VITE_APCO_SIGN_IN_URL: ${{ vars.VITE_APCO_SIGN_IN_URL }}
  VITE_APCO_API_DOCS_URL: ${{ vars.VITE_APCO_API_DOCS_URL }}
  APCO_PUBLIC_SITE_ORIGIN: ${{ vars.APCO_PUBLIC_SITE_ORIGIN }}

concurrency:
  group: ux-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Traditional Chinese fonts for localized checks
        run: sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Full release acceptance in Chromium, Firefox and WebKit
        run: npm test
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ux-review-${{ github.sha }}
          retention-days: 7
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
